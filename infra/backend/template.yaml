AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: capyweb backend (serverless, on-demand only). Stack name capyapp-capyweb-backend-<stage>.

# Naming: every resource is capyapp-* because that is the prefix the capyapp-deployers
# IAM group is scoped to. Lambda roles are created by SAM and MUST carry the
# capyapp-lambda-boundary permissions boundary - the deployer cannot create a role without it.

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "https://capytube.xyz,https://www.capytube.xyz,http://localhost:5173"
  # Sign-in e-mail (capyweb-w26). Passwordless e-mail OTP is only offered when the pool sends
  # mail through our own Amazon SES identity: Cognito's docs list e-mail OTP as "Requires
  # Essentials feature plan or higher and Amazon SES email configuration". Until an identity
  # is verified (and SES is out of its sandbox), leave these empty: the pool then uses the
  # Cognito default sender (50 e-mails a day per account) and offers password sign-in only.
  # See docs/WASM_PLAN.md section 3 ("The user pool as written").
  SesIdentityArn:
    Type: String
    Default: ""
    AllowedPattern: "^(arn:aws:ses:[a-z0-9-]+:[0-9]{12}:identity/.+)?$"
    Description: Verified SES identity (domain or address) Cognito sends from. Empty = Cognito default sender, no e-mail OTP.
  SesFromAddress:
    Type: String
    Default: ""
    Description: 'FROM header when SesIdentityArn is set, e.g. "CapyTube <no-reply@capytube.xyz>".'
  # Paid cameras (W6, docs/VIDEO_DESIGN.md). The id of the CloudFront PUBLIC key whose private half
  # is in SSM at /capyapp/capyweb/<stage>/playback-signing-key. The key and its key group are made
  # by an admin, outside every stack (capyweb-manager, 2026-09-29). Empty = the route answers 503.
  PlaybackKeyPairId:
    Type: String
    Default: ""
    AllowedPattern: "^[A-Z0-9]*$"

# The site each stage's sign-in returns to. Production is the apex domain, not "prod.".
Mappings:
  StageSite:
    dev: {Origin: "https://dev.capytube.xyz"}
    prod: {Origin: "https://capytube.xyz"}

Conditions:
  IsDev: !Equals [!Ref Stage, dev]
  UseSes: !Not [!Equals [!Ref SesIdentityArn, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    ReservedConcurrentExecutions: 5
    PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/capyapp-lambda-boundary
    Environment:
      Variables:
        STAGE: !Ref Stage
        TABLE_MAIN: !Sub capyapp-capyweb-${Stage}-main
        LOG_LEVEL: info
    Tags:
      Project: capyweb
      Stage: !Ref Stage

Resources:
  # API layer: HTTP API. Decision capyweb-xfp (2026-09-26) - apigateway was granted to
  # capyapp-deployers on 2026-09-24 via the capyapp-deploy-apigw policy, so the HTTP API is
  # deployable again and keeps JWT verification out of the Lambda. Function URLs (the earlier
  # workaround) cost nothing per request but would have pushed auth into every handler.
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20
      # POST /playback/{id} (PlaybackFunction) is called same-origin through the site's /api/*,
      # never cross-origin: its cookies must land on the site's domain. CORS below is for the rest.
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type, idempotency-key]
        MaxAge: 600
      Tags:
        Project: capyweb
        Stage: !Ref Stage
      # Native Cognito JWT authorizer: zero Lambda invocations for auth. No default, so every
      # route stays public unless it names `Auth: {Authorizer: CognitoJwt}`. API Gateway checks
      # the signature, issuer, expiry and the audience: `aud` on ID tokens, `client_id` on
      # access tokens (which carry no `aud`). The web app sends the ACCESS token. Handlers read
      # the caller from event.requestContext.authorizer.jwt.claims.sub.
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient

  # ---- Sign-in: Cognito user pool (capyweb-w26, docs/WASM_PLAN.md section 3) -----------------
  # Essentials tier: free to 10,000 MAU per account with no 12-month expiry (aws.amazon.com/
  # cognito/pricing, read 2026-09-29), and the lowest tier with choice-based sign-in, e-mail
  # OTP and the new managed login. Cost at ~100 MAU: $0.
  UserPool:
    Type: AWS::Cognito::UserPool
    # Users are data: a stack delete or a replacing change must never drop them.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub capyapp-capyweb-${Stage}-users
      UserPoolTier: ESSENTIALS
      DeletionProtection: ACTIVE
      UsernameAttributes: [email]
      UsernameConfiguration: {CaseSensitive: false}
      AutoVerifiedAttributes: [email]
      # A changed e-mail stays unconfirmed (and the old one keeps working) until the code
      # sent to the new address is entered.
      UserAttributeUpdateSettings: {AttributesRequireVerificationBeforeUpdate: [email]}
      Schema:
        - {Name: email, AttributeDataType: String, Required: true, Mutable: true}
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: false}
      AccountRecoverySetting:
        RecoveryMechanisms: [{Name: verified_email, Priority: 1}]
      # One-time-code first factors are refused while MFA is on.
      MfaConfiguration: "OFF"
      Policies:
        # Cognito refuses a sign-in policy without PASSWORD ("Password should be configured as
        # one of the allowed first auth factors"), so it stays listed; with SES, managed login
        # offers the e-mail code first and users can sign up without a password.
        SignInPolicy:
          AllowedFirstAuthFactors: !If [UseSes, [PASSWORD, EMAIL_OTP], [PASSWORD]]
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 1
      EmailConfiguration: !If
        - UseSes
        - {EmailSendingAccount: DEVELOPER, SourceArn: !Ref SesIdentityArn, From: !Ref SesFromAddress}
        - {EmailSendingAccount: COGNITO_DEFAULT}
      UserPoolTags:
        Project: capyweb
        Stage: !Ref Stage

  # Managed login on a free Cognito prefix domain (no certificate):
  # capyapp-capyweb-<stage>.auth.<region>.amazoncognito.com. Version 2 = the new managed login,
  # the only one that offers passwordless sign-in.
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub capyapp-capyweb-${Stage}
      ManagedLoginVersion: 2

  # The web app: a public client (it runs in the browser, so it cannot keep a secret).
  # Authorization code + PKCE only, no implicit flow, no SDK password flows.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub capyapp-capyweb-${Stage}-web
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      # ALLOW_USER_AUTH is choice-based sign-in, which managed login uses. No
      # ALLOW_REFRESH_TOKEN_AUTH: it is incompatible with refresh-token rotation; the app
      # refreshes at /oauth2/token, which rotates.
      ExplicitAuthFlows: [ALLOW_USER_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      # Each refresh returns a new refresh token and retires the old one after 10 s (a grace
      # period for a retried request). A stolen refresh token is then single-use.
      RefreshTokenRotation: {Feature: ENABLED, RetryGracePeriodSeconds: 10}
      # Short-lived access and ID tokens, kept in memory only; the app refreshes a minute
      # before expiry. 15 minutes bounds what a leaked access token is worth, at the cost of
      # one token request per signed-in tab every 14 minutes. The refresh token (in
      # localStorage) lasts 30 days, so a returning visitor stays signed in for a month.
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 30
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: days}
      # Time to finish a sign-in once started: long enough to fetch a code from the inbox.
      AuthSessionValidity: 10
      # The stage's site from the StageSite mapping; loopback URLs only in dev. Cognito accepts plain http for http://localhost,
      # http://127.0.0.1 and http://[::1] ("for testing purposes only"); `trunk serve` binds
      # 127.0.0.1:8791 (web/Trunk.toml).
      CallbackURLs: !If
        - IsDev
        - - !Sub ["${Origin}/auth/callback", {Origin: !FindInMap [StageSite, !Ref Stage, Origin]}]
          - "http://127.0.0.1:8791/auth/callback"
          - "http://localhost:8791/auth/callback"
        - - !Sub ["${Origin}/auth/callback", {Origin: !FindInMap [StageSite, !Ref Stage, Origin]}]
      LogoutURLs: !If
        - IsDev
        - - !Sub ["${Origin}/", {Origin: !FindInMap [StageSite, !Ref Stage, Origin]}]
          - "http://127.0.0.1:8791/"
          - "http://localhost:8791/"
        - - !Sub ["${Origin}/", {Origin: !FindInMap [StageSite, !Ref Stage, Origin]}]

  # PLAN B3's staff role group. No members and no IAM role; nothing reads it yet (the admin
  # console, Epic E, will check the `cognito:groups` claim).
  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: Admins
      Description: CapyTube staff. No members yet; nothing reads this group yet.

  # Managed login v2 shows nothing for a client without a branding style. Cognito's own
  # defaults for now; the capybara look can come later in the visual editor.
  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

  HealthFunction:
    Type: AWS::Serverless::Function
    Metadata: {BuildMethod: esbuild, BuildProperties: {EntryPoints: [health.ts], Target: es2022, Minify: true, Format: esm, OutExtension: [".js=.mjs"]}}
    Properties:
      FunctionName: !Sub capyapp-capyweb-${Stage}-health
      CodeUri: ../../backend/src/
      Handler: health.handler
      ReservedConcurrentExecutions: 2
      Events:
        Get: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /health, Method: GET}}

  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/capyapp-capyweb-${Stage}-health
      RetentionInDays: 14
      Tags:
        - {Key: Project, Value: capyweb}

  # Public catalog reads (capyweb-qu7). No authorizer: these are the highest-traffic routes
  # and must not pay for auth. Responses carry s-maxage so CloudFront absorbs the repeats.
  CatalogFunction:
    Type: AWS::Serverless::Function
    Metadata: {BuildMethod: esbuild, BuildProperties: {EntryPoints: [catalog.ts], Target: es2022, Minify: true, Format: esm, OutExtension: [".js=.mjs"], External: ["@aws-sdk/*"]}}
    Properties:
      FunctionName: !Sub capyapp-capyweb-${Stage}-catalog
      CodeUri: ../../backend/src/
      Handler: catalog.handler
      ReservedConcurrentExecutions: 5
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource:
                - !GetAtt MainTable.Arn
                - !Sub "${MainTable.Arn}/index/*"
      Events:
        ListCapybaras:    {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /capybaras, Method: GET}}
        GetCapybara:      {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: "/capybaras/{id}", Method: GET}}
        ListInteractions: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: "/capybaras/{id}/interactions", Method: GET}}
        ListStreams:      {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /streams, Method: GET}}
        GetStreamItem:    {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: "/streams/{id}", Method: GET}}
        ListNfts:         {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /nfts, Method: GET}}
        GetNft:           {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: "/nfts/{id}", Method: GET}}
        ListOffers:       {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: "/nfts/{id}/offers", Method: GET}}
        ListActivity:     {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: "/nfts/{id}/activity", Method: GET}}

  CatalogLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/capyapp-capyweb-${Stage}-catalog
      RetentionInDays: 14
      Tags:
        - {Key: Project, Value: capyweb}

  # Authenticated API (capyweb-7hj) and the play-coin ledger (capyweb-3ge). One warm function for
  # the signed-in routes plus the public chat read. The caller is the access token's `sub`, verified
  # by CognitoJwt before the Lambda runs; balances are written only here.
  # IAM lists only what writes.ts and lib/ledger.ts call. TransactWriteItems has no action of its
  # own: each item needs its operation's (PutItem, UpdateItem, ConditionCheckItem). Query on GSI1
  # finds an interaction by id. No Scan, DeleteItem, BatchGetItem or BatchWriteItem: nothing
  # deletes (chat and idempotency markers expire by TTL, which needs no permission) and nothing
  # batches.
  WritesFunction:
    Type: AWS::Serverless::Function
    Metadata: {BuildMethod: esbuild, BuildProperties: {EntryPoints: [writes.ts], Target: es2022, Minify: true, Format: esm, OutExtension: [".js=.mjs"], External: ["@aws-sdk/*"]}}
    Properties:
      FunctionName: !Sub capyapp-capyweb-${Stage}-writes
      CodeUri: ../../backend/src/
      Handler: writes.handler
      # 10 rps x ~100 ms per request needs ~1 concurrent execution; 5 leaves room for the
      # 20-request burst DefaultRouteSettings allows without letting a flood fan out.
      ReservedConcurrentExecutions: 5
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt MainTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource: !Sub "${MainTable.Arn}/index/GSI1"
      Events:
        GetMe:            {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /me, Method: GET, Auth: {Authorizer: CognitoJwt}}}
        PutMe:            {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /me, Method: PUT, Auth: {Authorizer: CognitoJwt}}}
        ListTransactions: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /me/transactions, Method: GET, Auth: {Authorizer: CognitoJwt}}}
        Vote:             {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: "/interactions/{id}/votes", Method: POST, Auth: {Authorizer: CognitoJwt}}}
        Bid:              {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: "/interactions/{id}/bids", Method: POST, Auth: {Authorizer: CognitoJwt}}}
        # Public: reading chat needs no sign-in (docs/WASM_PLAN.md section 4). Answers carry
        # Cache-Control public, max-age=5 and display names only.
        ListChat:         {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: "/streams/{id}/chat", Method: GET}}
        PostChat:         {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: "/streams/{id}/chat", Method: POST, Auth: {Authorizer: CognitoJwt}}}
        React:            {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: "/streams/{id}/reactions", Method: POST, Auth: {Authorizer: CognitoJwt}}}

  # Paid cameras (W6): POST /playback/{id} takes the coins and sets the CloudFront signed cookies
  # that open /paid/<id>/ on the site. The browser calls it as /api/playback/<id> through the
  # site's distribution, so the cookies land on the site's domain. Its own function because it is
  # the only one that may read the signing key.
  PlaybackFunction:
    Type: AWS::Serverless::Function
    Metadata: {BuildMethod: esbuild, BuildProperties: {EntryPoints: [playback.ts], Target: es2022, Minify: true, Format: esm, OutExtension: [".js=.mjs"], External: ["@aws-sdk/*"]}}
    Properties:
      FunctionName: !Sub capyapp-capyweb-${Stage}-playback
      CodeUri: ../../backend/src/
      Handler: playback.handler
      # One call a minute per paying viewer.
      ReservedConcurrentExecutions: 3
      Environment:
        Variables:
          SITE_ORIGIN: !FindInMap [StageSite, !Ref Stage, Origin]
          SIGNING_KEY_PAIR_ID: !Ref PlaybackKeyPairId
          SIGNING_KEY_PARAM: !Sub /capyapp/capyweb/${Stage}/playback-signing-key
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt MainTable.Arn
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/capyapp/capyweb/${Stage}/playback-signing-key
            # SecureString under the AWS managed key aws/ssm: decrypt only on SSM's behalf.
            - Effect: Allow
              Action: [kms:Decrypt]
              Resource: "*"
              Condition: {StringEquals: {kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"}}
      Events:
        Playback: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: "/playback/{id}", Method: POST, Auth: {Authorizer: CognitoJwt}}}

  PlaybackLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/capyapp-capyweb-${Stage}-playback
      RetentionInDays: 14
      Tags:
        - {Key: Project, Value: capyweb}

  WritesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/capyapp-capyweb-${Stage}-writes
      RetentionInDays: 14
      Tags:
        - {Key: Project, Value: capyweb}

  # Synthetic check (capyweb-1td). Every 5 minutes: ~8,640 invocations/month, well inside the
  # Lambda free tier. A CloudWatch Synthetics canary would cost ~$10/month - the whole budget -
  # and the deploy identity has no synthetics grant anyway.
  HealthCheckFunction:
    Type: AWS::Serverless::Function
    Metadata: {BuildMethod: esbuild, BuildProperties: {EntryPoints: [healthcheck.ts], Target: es2022, Minify: true, Format: esm, OutExtension: [".js=.mjs"], External: ["@aws-sdk/*"]}}
    Properties:
      FunctionName: !Sub capyapp-capyweb-${Stage}-healthcheck
      CodeUri: ../../backend/src/
      Handler: healthcheck.handler
      ReservedConcurrentExecutions: 2
      Timeout: 30
      Environment:
        Variables:
          TARGETS: !Sub
            # Each target carries a body marker: a 200 with the wrong content (a parked page,
            # someone else's default index) must count as unhealthy, not healthy.
            - "api=${ApiBase}/health|\"ok\":true,site=https://${Stage}.capytube.xyz/|CapyTube"
            - ApiBase: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
      Policies:
        - Statement:
            - Effect: Allow
              Action: [cloudwatch:PutMetricData]
              Resource: "*"
              Condition: {StringEquals: {"cloudwatch:namespace": "capyweb/Synthetic"}}
      Events:
        # Classic Schedule (an EventBridge RULE), not ScheduleV2. ScheduleV2 uses EventBridge
        # Scheduler, which needs its own IAM execution role - and the deploy identity may only
        # create roles carrying the capyapp-lambda-boundary, which SAM does not attach to that
        # generated role. A rule invokes Lambda through a resource policy and needs no role.
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)

  HealthCheckLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/capyapp-capyweb-${Stage}-healthcheck
      RetentionInDays: 14
      Tags:
        - {Key: Project, Value: capyweb}

  # The alarms below notify this topic (capyweb-19a). Alarms can only publish to a topic in their
  # own region, so it is not the us-east-1 capyapp-capyweb-alerts topic of infra/ops/template.yaml.
  # Who is subscribed is decided outside the template: an address never goes into the repo.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub capyapp-capyweb-${Stage}-alarms
      DisplayName: !Sub capyweb ${Stage} alarms
      Tags:
        - {Key: Project, Value: capyweb}

  ApiDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub capyapp-capyweb-${Stage}-api-down
      AlarmDescription: The synthetic check could not get a healthy /health for 15 minutes.
      Namespace: capyweb/Synthetic
      MetricName: Healthy
      Dimensions: [{Name: Target, Value: api}]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]

  SiteDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub capyapp-capyweb-${Stage}-site-down
      AlarmDescription: The synthetic check could not load the site for 15 minutes.
      Namespace: capyweb/Synthetic
      MetricName: Healthy
      Dimensions: [{Name: Target, Value: site}]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]

  # The table has a hard OnDemandThroughput ceiling, so a burst throttles rather than bills.
  # That is the intended behaviour, but it should never be silent.
  TableThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub capyapp-capyweb-${Stage}-table-throttled
      AlarmDescription: DynamoDB is throttling - the on-demand ceiling is being hit.
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions: [{Name: TableName, Value: !Ref MainTable}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # Single table. On-demand with a hard ceiling: past it, requests throttle instead of billing.
  # PK/SK plus two overloaded GSIs cover the 11 former Amplify models and the robot/slot types.
  MainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub capyapp-capyweb-${Stage}-main
      BillingMode: PAY_PER_REQUEST
      OnDemandThroughput: {MaxReadRequestUnits: 50, MaxWriteRequestUnits: 20}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      # Chat (30 days) and idempotency markers (24 h) delete themselves; TTL deletes are free.
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: GSI1PK, AttributeType: S}
        - {AttributeName: GSI1SK, AttributeType: S}
        - {AttributeName: GSI2PK, AttributeType: S}
        - {AttributeName: GSI2SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - {AttributeName: GSI1PK, KeyType: HASH}
            - {AttributeName: GSI1SK, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
          OnDemandThroughput: {MaxReadRequestUnits: 50, MaxWriteRequestUnits: 20}
        - IndexName: GSI2
          KeySchema:
            - {AttributeName: GSI2PK, KeyType: HASH}
            - {AttributeName: GSI2SK, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
          OnDemandThroughput: {MaxReadRequestUnits: 50, MaxWriteRequestUnits: 20}
      Tags:
        - {Key: Project, Value: capyweb}
        - {Key: Stage, Value: !Ref Stage}

Outputs:
  ApiUrl:
    Description: HTTP API base URL. Public catalog /capybaras, /streams, /nfts; signed-in /me, /interactions/{id}/votes|bids, POST /streams/{id}/chat|reactions, POST /playback/{id}; public GET /streams/{id}/chat.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  MainTableName:
    Value: !Ref MainTable
  UserPoolId:
    Description: Cognito user pool for sign-in.
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Public web client id (no secret). Goes in the web app's auth config.
    Value: !Ref UserPoolClient
  ManagedLoginDomain:
    Description: Managed login host. The web app's auth config takes it as https://<this>.
    Value: !Sub ${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  AuthIssuer:
    Description: JWT issuer the CognitoJwt authorizer trusts.
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
