AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: capyweb backend (serverless, on-demand only). Stack name capyweb-backend-<stage>.

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
  LambdaExecRoleArn:
    Type: String
    Description: Pre-made role arn:aws:iam::619071347239:role/capyweb-lambda-exec
  DynamicEnvironmentId:
    Type: String
    Default: 066bc44d-7c4b-44f5-95a4-5ce8b41b1d33
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "https://capytube.xyz,https://www.capytube.xyz,http://localhost:5173"

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    ReservedConcurrentExecutions: 5
    Environment:
      Variables:
        STAGE: !Ref Stage
        TABLE_PREFIX: !Sub capyweb-${Stage}-
        LIVEPEER_PARAM: /capyweb/livepeer-api-key

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 600
      # Auth for write routes: Lambda authorizer verifying Dynamic JWTs against
      # https://app.dynamic.xyz/api/v0/sdk/<env>/.well-known/jwks (Dynamic has no OIDC discovery,
      # so the built-in HTTP API JWT authorizer can't be used). Added with the first write route.

  HealthFunction:
    Type: AWS::Serverless::Function
    Metadata: {BuildMethod: esbuild, BuildProperties: {EntryPoints: [health.ts], Target: es2022, Minify: true}}
    Properties:
      FunctionName: !Sub capyweb-${Stage}-health
      CodeUri: ../../backend/src/
      Role: !Ref LambdaExecRoleArn
      Handler: health.handler
      ReservedConcurrentExecutions: 2
      Events:
        Get: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /health, Method: GET}}

  StreamFunction:
    Type: AWS::Serverless::Function
    Metadata: {BuildMethod: esbuild, BuildProperties: {EntryPoints: [stream.ts], Target: es2022, Minify: true}}
    Properties:
      FunctionName: !Sub capyweb-${Stage}-stream
      CodeUri: ../../backend/src/
      Role: !Ref LambdaExecRoleArn
      Handler: stream.handler
      ReservedConcurrentExecutions: 2
      Events:
        Stream: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: "/stream/{id}", Method: GET}}
        Viewership: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: "/viewership/{id}", Method: GET}}

  # On-demand tables with hard throughput ceilings. No ProvisionedThroughput anywhere.
  UserTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub capyweb-${Stage}-User
      BillingMode: PAY_PER_REQUEST
      OnDemandThroughput: {MaxReadRequestUnits: 50, MaxWriteRequestUnits: 20}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      AttributeDefinitions:
        - {AttributeName: id, AttributeType: S}
        - {AttributeName: wallet_address, AttributeType: S}
        - {AttributeName: email, AttributeType: S}
      KeySchema: [{AttributeName: id, KeyType: HASH}]
      GlobalSecondaryIndexes:
        - IndexName: ByWalletAddress
          KeySchema: [{AttributeName: wallet_address, KeyType: HASH}]
          Projection: {ProjectionType: ALL}
          OnDemandThroughput: {MaxReadRequestUnits: 50, MaxWriteRequestUnits: 20}
        - IndexName: ByEmailAddress
          KeySchema: [{AttributeName: email, KeyType: HASH}]
          Projection: {ProjectionType: ALL}
          OnDemandThroughput: {MaxReadRequestUnits: 50, MaxWriteRequestUnits: 20}

  CapybaraTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub capyweb-${Stage}-Capybara
      BillingMode: PAY_PER_REQUEST
      OnDemandThroughput: {MaxReadRequestUnits: 50, MaxWriteRequestUnits: 20}
      AttributeDefinitions: [{AttributeName: id, AttributeType: S}]
      KeySchema: [{AttributeName: id, KeyType: HASH}]

  LiveStreamTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub capyweb-${Stage}-LiveStream
      BillingMode: PAY_PER_REQUEST
      OnDemandThroughput: {MaxReadRequestUnits: 50, MaxWriteRequestUnits: 20}
      AttributeDefinitions: [{AttributeName: id, AttributeType: S}]
      KeySchema: [{AttributeName: id, KeyType: HASH}]

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
