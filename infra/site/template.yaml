AWSTemplateFormatVersion: '2010-09-09'
Description: capyweb site - private S3 + CloudFront (OAC) on <stage>.capytube.xyz, plus the video media bucket (W6).
Parameters:
  Stage: {Type: String, Default: dev}
  DomainName: {Type: String, Default: dev.capytube.xyz}
  CertArn: {Type: String, Description: ACM cert in us-east-1 covering DomainName}
  # Paid cameras (docs/VIDEO_DESIGN.md section 4). The id of the CloudFront key group that holds
  # the signing key's PUBLIC half. The key group is made outside this stack, by an admin
  # (capyweb-manager, 2026-09-29): the deploy user has no key-group permissions, because those
  # would reach every project's signing keys in the account. The private half lives only in SSM
  # (/capyapp/capyweb/<stage>/playback-signing-key). Empty = no /paid/* behaviour, so paid files
  # are not reachable at all.
  PlaybackKeyGroupId: {Type: String, Default: ""}
  # The HTTP API behind /api/* (e.g. abc123.execute-api.ap-southeast-1.amazonaws.com) and its
  # stage path (/dev). Empty = no /api/* behaviour. With it, the SPA fallback moves from the
  # distribution-wide error responses to a viewer-request function (see SpaFunction).
  ApiDomain: {Type: String, Default: ""}
  ApiOriginPath: {Type: String, Default: ""}
  # The response headers policy (the CSP and security headers) made by an admin from
  # infra/site/headers-<stage>.json: no stack may create, update or delete a headers policy, since
  # that right reaches every project's in the account (capyweb-manager, 2026-09-29). This stack only
  # attaches it. Empty = AWS's managed SecurityHeadersPolicy, with no CSP.
  ResponseHeadersPolicyId: {Type: String, Default: ""}
  # A second name, answered with a 301 to DomainName by SpaFunction (production: www.capytube.xyz).
  # Sign-in returns only to DomainName (the user pool's callback), so www must not serve the app.
  # The certificate must cover it. Empty = one name.
  WwwDomain: {Type: String, Default: ""}
  # PriceClass_100 serves only from North America and Europe: a viewer in Asia gets a European
  # edge (Marseille, measured from this team's Mac). Production uses PriceClass_200, which adds Asia;
  # inside the account's free 1 TB it costs the same (capyweb-manager, 2026-09-29).
  PriceClass: {Type: String, Default: PriceClass_100, AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]}
Conditions:
  HasPlaybackKey: !Not [!Equals [!Ref PlaybackKeyGroupId, ""]]
  HasApi: !Not [!Equals [!Ref ApiDomain, ""]]
  HasHeadersPolicy: !Not [!Equals [!Ref ResponseHeadersPolicyId, ""]]
  HasWww: !Not [!Equals [!Ref WwwDomain, ""]]
Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition: {StringEquals: {AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Cdn}"}}
  # Video (W6, docs/VIDEO_DESIGN.md). Recordings today (nic, 2026-09-29), the encoder box's live
  # windows later. Keys: media/... (public, CloudFront /media/*) and paid/... (CloudFront /paid/*,
  # signed cookies only). No versioning: a versioned bucket keeps every replaced segment, and that
  # is paid storage. Only CloudFront reads it; the bucket answers nothing over plain HTTP.
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
      LifecycleConfiguration:
        Rules:
          - {Id: abort-incomplete-uploads, Status: Enabled, AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}}
      Tags: [{Key: capy-scope, Value: capyapp}, {Key: Project, Value: capyweb}, {Key: Stage, Value: !Ref Stage}]
  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${MediaBucket.Arn}/*
            Condition: {StringEquals: {AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Cdn}"}}
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt MediaBucket.Arn, !Sub "${MediaBucket.Arn}/*"]
            Condition: {Bool: {aws:SecureTransport: 'false'}}
  Oac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-s3
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  # The SPA fallback, once /api/* exists. A path without a file extension is a page of the app:
  # serve the shell and let the client router resolve it. Unlike the error responses it replaces,
  # this touches only the site's own paths, so the API's 403/404 answers and CloudFront's refusals
  # on /paid/* reach the browser as they are, and a missing asset is a real error, not HTML.
  # A path that is not one of the app's routes still gets the shell (the client shows "Page not
  # found"), marked for NotFoundFunction. ROUTES is web/src/app.rs; a Rust test
  # (routes.rs, edge_routes_match_the_app) keeps both copies in step with it.
  # A request to a www. name goes to the same path on the name without it (see WwwDomain).
  SpaFunction:
    Type: AWS::CloudFront::Function
    Condition: HasApi
    Properties:
      Name: !Sub capyapp-capyweb-${Stage}-spa
      AutoPublish: true
      FunctionConfig: {Comment: SPA fallback for extensionless paths, Runtime: cloudfront-js-2.0}
      FunctionCode: |
        var ROUTES = ['/', '/watch', '/play', '/shop', '/robot', '/profile', '/about-us', '/privacy-policy', '/terms-of-service', '/deletion', '/auth/callback'];
        function known(u) {
          if (u.length > 1 && u.charAt(u.length - 1) === '/') u = u.slice(0, -1); // the client router takes /watch/ as /watch
          return ROUTES.indexOf(u) >= 0 || /^\/(stream|shop)\/[^\/]+$/.test(u);
        }
        function query(q) {
          var parts = [];
          for (var k in q) {
            var all = q[k].multiValue || [q[k]];
            for (var i = 0; i < all.length; i++) parts.push(all[i].value === '' ? k : k + '=' + all[i].value);
          }
          return parts.length ? '?' + parts.join('&') : '';
        }
        function handler(event) {
          var r = event.request, host = r.headers.host ? r.headers.host.value : '';
          if (host.indexOf('www.') === 0) {
            return {statusCode: 301, statusDescription: 'Moved Permanently', headers: {
              location: {value: 'https://' + host.slice(4) + r.uri + query(r.querystring || {})},
              'cache-control': {value: 'public,max-age=3600'}}};
          }
          if (r.uri.lastIndexOf('.') <= r.uri.lastIndexOf('/')) {
            if (!known(r.uri)) r.headers['x-capyweb-route'] = {value: 'unknown'};
            r.uri = '/index.html';
          }
          return r;
        }
  # A real 404 for a path that is not a page of the app, so search engines drop it instead of
  # reading a soft 404 (docs/CRAWLERS_NOTES.md). The shell's body stays, so a person still sees
  # "Page not found". It runs only on 200s (CloudFront skips viewer-response functions on 4xx/5xx
  # from the origin). AWS does not say whether event.request here is the viewer's original request
  # or the one SpaFunction rewrote, so both the marker and the path are checked, and the
  # x-capyweb-404 header says which one fired.
  NotFoundFunction:
    Type: AWS::CloudFront::Function
    Condition: HasApi
    Properties:
      Name: !Sub capyapp-capyweb-${Stage}-not-found
      AutoPublish: true
      FunctionConfig: {Comment: 404 for paths that are not routes of the app, Runtime: cloudfront-js-2.0}
      FunctionCode: |
        var ROUTES = ['/', '/watch', '/play', '/shop', '/robot', '/profile', '/about-us', '/privacy-policy', '/terms-of-service', '/deletion', '/auth/callback'];
        function known(u) {
          if (u.length > 1 && u.charAt(u.length - 1) === '/') u = u.slice(0, -1); // the client router takes /watch/ as /watch
          return ROUTES.indexOf(u) >= 0 || /^\/(stream|shop)\/[^\/]+$/.test(u);
        }
        function handler(event) {
          var q = event.request, s = event.response, why = '';
          if (s.statusCode !== 200) return s;
          if (q.headers['x-capyweb-route']) why = 'marker';
          else if (q.uri !== '/index.html' && q.uri.lastIndexOf('.') <= q.uri.lastIndexOf('/') && !known(q.uri)) why = 'path';
          if (why) {
            s.statusCode = 404;
            s.statusDescription = 'Not Found';
            s.headers['x-capyweb-404'] = {value: why};
          }
          return s;
        }
  # /api/x -> the HTTP API's /x. Same-origin, so the playback route's Set-Cookie lands on the
  # site's domain, where CloudFront checks it (docs/VIDEO_DESIGN.md section 4).
  # A person who opens an /api URL in the browser sees a page, never the API's JSON (capyweb-loh):
  # /api/me and below go to /profile, whose signed-out view is the Sign in; any other /api URL goes
  # to the home page. Only a top-level navigation is sent away (Sec-Fetch-Mode: navigate; a browser
  # without Sec-Fetch-* headers when it asks for HTML first). The app's fetch() calls, the video
  # element and hls.js are never navigations, so the API answers them as before.
  # Tests: infra/site/test_edge.mjs (scripts/guard.sh runs them).
  ApiFunction:
    Type: AWS::CloudFront::Function
    Condition: HasApi
    Properties:
      Name: !Sub capyapp-capyweb-${Stage}-api-prefix
      AutoPublish: true
      FunctionConfig: {Comment: strip the /api prefix; send browser visits to a page, Runtime: cloudfront-js-2.0}
      FunctionCode: |
        function handler(event) {
          var r = event.request, h = r.headers;
          var mode = h['sec-fetch-mode'] ? h['sec-fetch-mode'].value : '';
          var accept = h.accept ? h.accept.value : '';
          if (mode === 'navigate' || (!mode && /^text\/html(?:[;,\s]|$)/i.test(accept))) {
            return {statusCode: 302, statusDescription: 'Found', headers: {
              location: {value: /^\/api\/me(\/|$)/.test(r.uri) ? '/profile' : '/'},
              'cache-control': {value: 'no-store'}}};
          }
          r.uri = r.uri.slice(4) || '/';
          return r;
        }
  # The browser keeps the public API answers for a minute (max-age=60). Without a Vary, a person who
  # opens /api/streams after a page fetched it gets that cached JSON from the browser itself, and
  # ApiFunction never sees the visit (capyweb-loh; found by live-checks on prod). Vary on
  # Sec-Fetch-Mode (and Accept, for browsers without Sec-Fetch-*) keeps the app's cached fetch()
  # answers apart from a visit. Added to any Vary the API sends; tests in infra/site/test_edge.mjs.
  ApiVaryFunction:
    Type: AWS::CloudFront::Function
    Condition: HasApi
    Properties:
      Name: !Sub capyapp-capyweb-${Stage}-api-vary
      AutoPublish: true
      FunctionConfig: {Comment: keep cached API answers apart from browser visits, Runtime: cloudfront-js-2.0}
      FunctionCode: |
        function handler(event) {
          var s = event.response, v = s.headers.vary ? s.headers.vary.value : '';
          var have = v.toLowerCase().split(',').map(function (x) { return x.trim(); });
          if (have.indexOf('*') >= 0) return s;
          var add = ['Sec-Fetch-Mode', 'Accept'].filter(function (h) { return have.indexOf(h.toLowerCase()) < 0; });
          if (add.length) s.headers.vary = {value: (v.trim() ? v.trim() + ', ' : '') + add.join(', ')};
          return s;
        }
  Cdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags: [{Key: capy-scope, Value: capyapp}, {Key: Project, Value: capyweb}, {Key: Stage, Value: !Ref Stage}]
      DistributionConfig:
        Enabled: true
        Comment: !Ref AWS::StackName
        Aliases: !If [HasWww, [!Ref DomainName, !Ref WwwDomain], [!Ref DomainName]]
        DefaultRootObject: index.html
        PriceClass: !Ref PriceClass
        HttpVersion: http2and3
        ViewerCertificate: {AcmCertificateArn: !Ref CertArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021}
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt Oac.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
          - Id: media
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt Oac.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
          - !If
            - HasApi
            - Id: api
              DomainName: !Ref ApiDomain
              OriginPath: !Ref ApiOriginPath
              CustomOriginConfig: {OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2]}
            - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6            # Managed-CachingOptimized
          ResponseHeadersPolicyId: !If [HasHeadersPolicy, !Ref ResponseHeadersPolicyId, 67f7725c-6f97-4210-82d7-5512b31e9d03]  # else Managed-SecurityHeadersPolicy
          FunctionAssociations: !If
            - HasApi
            - - {EventType: viewer-request, FunctionARN: !GetAtt SpaFunction.FunctionMetadata.FunctionARN}
              - {EventType: viewer-response, FunctionARN: !GetAtt NotFoundFunction.FunctionMetadata.FunctionARN}
            - !Ref AWS::NoValue
        CacheBehaviors:
          # Recordings, the reel and (later) public live windows. Objects carry their own
          # Cache-Control from infra/media/upload-media.sh.
          - PathPattern: /media/*
            TargetOriginId: media
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6            # Managed-CachingOptimized
            ResponseHeadersPolicyId: !If [HasHeadersPolicy, !Ref ResponseHeadersPolicyId, 67f7725c-6f97-4210-82d7-5512b31e9d03]  # else Managed-SecurityHeadersPolicy
          # Paid cameras: CloudFront accepts a /paid/* request only with cookies signed by a key in
          # the key group; the playback Lambda (backend/src/playback.ts) signs them after it has
          # taken the coins. Signed cookies are checked at the edge before the cache, and are not
          # in the cache key, so every paying viewer shares one cached copy and nobody else gets it.
          - !If
            - HasPlaybackKey
            - PathPattern: /paid/*
              TargetOriginId: media
              ViewerProtocolPolicy: https-only
              Compress: true
              TrustedKeyGroups: [!Ref PlaybackKeyGroupId]
              CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6            # Managed-CachingOptimized
              ResponseHeadersPolicyId: !If [HasHeadersPolicy, !Ref ResponseHeadersPolicyId, 67f7725c-6f97-4210-82d7-5512b31e9d03]  # else Managed-SecurityHeadersPolicy
            - !Ref AWS::NoValue
          # The HTTP API, same-origin. Nothing cached; every viewer header (Authorization included)
          # and cookie goes to the API, and its Set-Cookie comes back.
          - !If
            - HasApi
            - PathPattern: /api/*
              TargetOriginId: api
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              CachedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
              FunctionAssociations:
                - {EventType: viewer-request, FunctionARN: !GetAtt ApiFunction.FunctionMetadata.FunctionARN}
                - {EventType: viewer-response, FunctionARN: !GetAtt ApiVaryFunction.FunctionMetadata.FunctionARN}
            - !Ref AWS::NoValue
        CustomErrorResponses: !If
          - HasApi
          - !Ref AWS::NoValue    # SpaFunction does this job, for the site's paths only
          # SPA fallback: a deep link like /watch is not an object in the bucket, so S3+OAC
          # answers 403 (ListBucket is denied, so it cannot say 404). Serve index.html with
          # 200 and let the client router resolve the path - answering 404 here breaks every
          # deep link and every shared URL.
          # ErrorCachingMinTTL is set for completeness but does NOT govern here: because the
          # response is rewritten to 200, CloudFront caches it like any success, using
          # index.html's own Cache-Control. deploy.sh uploads index.html as no-cache for
          # exactly this reason - otherwise a missing path would be pinned to HTML for 24h.
          - - {ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 10}
            - {ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 10}
          # Tradeoff: a genuinely missing asset (e.g. /assets/stale.js after a deploy) also
          # returns index.html with 200, surfacing as "Unexpected token '<'" rather than a
          # 404. Custom error responses are DISTRIBUTION-wide - there is no per-behaviour
          # override - so this cannot be fixed with an /assets/* cache behaviour. It also
          # applies to /media/*: a missing recording is index.html with 200, which the player
          # treats as a failed source. SpaFunction (with ApiDomain set) removes all of this.
          # Also note: every unknown path returns 200 with the same shell, i.e. soft-404s. With
          # ApiDomain set, NotFoundFunction answers 404 for them instead (capyweb-1w5).
Outputs:
  Url: {Value: !Sub "https://${DomainName}/"}
  Bucket: {Value: !Ref SiteBucket}
  MediaBucket: {Value: !Ref MediaBucket}
  DistributionId: {Value: !Ref Cdn}
  CdnDomain: {Value: !GetAtt Cdn.DomainName}
