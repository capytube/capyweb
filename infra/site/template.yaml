AWSTemplateFormatVersion: '2010-09-09'
Description: capyweb site - private S3 + CloudFront (OAC) on <stage>.capytube.xyz. Serves demo/ until the React cutover (Epic C).
Parameters:
  Stage: {Type: String, Default: dev}
  DomainName: {Type: String, Default: dev.capytube.xyz}
  CertArn: {Type: String, Description: ACM cert in us-east-1 covering DomainName}
Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition: {StringEquals: {AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Cdn}"}}
  Oac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-s3
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  Cdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags: [{Key: capy-scope, Value: capyapp}, {Key: Project, Value: capyweb}, {Key: Stage, Value: !Ref Stage}]
      DistributionConfig:
        Enabled: true
        Comment: !Ref AWS::StackName
        Aliases: [!Ref DomainName]
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        ViewerCertificate: {AcmCertificateArn: !Ref CertArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021}
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt Oac.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6            # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy
        CustomErrorResponses:
          # SPA fallback: a deep link like /watch is not an object in the bucket, so S3+OAC
          # answers 403 (ListBucket is denied, so it cannot say 404). Serve index.html with
          # 200 and let the client router resolve the path - answering 404 here breaks every
          # deep link and every shared URL.
          - {ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 10}
          - {ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 10}
          # Tradeoff: a genuinely missing asset (e.g. /assets/stale.js after a deploy) also
          # returns index.html with 200, which surfaces in the browser as
          # "Unexpected token '<'" rather than a 404. That is the usual SPA bargain. If it
          # becomes a nuisance, add a second cache behaviour for /assets/* with no custom
          # error response - these responses are distribution-wide, not per-path.
Outputs:
  Url: {Value: !Sub "https://${DomainName}/"}
  Bucket: {Value: !Ref SiteBucket}
  DistributionId: {Value: !Ref Cdn}
  CdnDomain: {Value: !GetAtt Cdn.DomainName}
