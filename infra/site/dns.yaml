AWSTemplateFormatVersion: '2010-09-09'
Description: capyweb site DNS - alias records in the capytube.xyz zone. Deployed in autonomous-lab with --profile capytube-dns.
  For production this stack is the apex switch (docs/RELEASE_PLAN.md, D2), deployed only on herdr-master's go.
Parameters:
  DomainName: {Type: String, Default: dev.capytube.xyz}
  # Production's second name (www.capytube.xyz): the distribution answers it with a 301 to DomainName.
  WwwDomain: {Type: String, Default: ""}
  CdnDomain: {Type: String}
  # Sign-in (managed login) on our own name, so passkeys belong to capytube.xyz (hm-nuhjd): the
  # name and the CloudFront host Cognito gives its custom domain (backend output AuthDomainCdn).
  AuthDomain: {Type: String, Default: ""}
  AuthCdn: {Type: String, Default: ""}
Conditions:
  HasWww: !Not [!Equals [!Ref WwwDomain, ""]]
  HasAuth: !Not [!Equals [!Ref AuthCdn, ""]]
Resources:
  Records:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneName: capytube.xyz.
      RecordSets:
        - {Name: !Ref DomainName, Type: A, AliasTarget: {DNSName: !Ref CdnDomain, HostedZoneId: Z2FDTNDATAQYW2}}
        - {Name: !Ref DomainName, Type: AAAA, AliasTarget: {DNSName: !Ref CdnDomain, HostedZoneId: Z2FDTNDATAQYW2}}
  WwwRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasWww
    Properties:
      HostedZoneName: capytube.xyz.
      RecordSets:
        - {Name: !Ref WwwDomain, Type: A, AliasTarget: {DNSName: !Ref CdnDomain, HostedZoneId: Z2FDTNDATAQYW2}}
        - {Name: !Ref WwwDomain, Type: AAAA, AliasTarget: {DNSName: !Ref CdnDomain, HostedZoneId: Z2FDTNDATAQYW2}}
  AuthRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasAuth
    Properties:
      HostedZoneName: capytube.xyz.
      RecordSets:
        - {Name: !Ref AuthDomain, Type: A, AliasTarget: {DNSName: !Ref AuthCdn, HostedZoneId: Z2FDTNDATAQYW2}}
        - {Name: !Ref AuthDomain, Type: AAAA, AliasTarget: {DNSName: !Ref AuthCdn, HostedZoneId: Z2FDTNDATAQYW2}}
