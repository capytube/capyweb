name: capyweb-aws
# Runs only on pushes to main touching infra/backend, or by hand. Never on pull requests,
# so forks can't reach the secrets.
on:
  push:
    branches: [main]
    paths: ["infra/**", "backend/**", ".github/workflows/capyweb-aws.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency: {group: capyweb-aws, cancel-in-progress: false}

jobs:
  verify-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets present
        env:
          A: ${{ secrets.CAPY_AWS_ACCESS_KEY_ID }}
          B: ${{ secrets.AL_DNS_AWS_ACCESS_KEY_ID }}
        run: |
          [ -n "$A" ] || { echo "::error::CAPY_AWS_ACCESS_KEY_ID secret missing"; exit 1; }
          [ -n "$B" ] || { echo "::error::AL_DNS_AWS_ACCESS_KEY_ID secret missing"; exit 1; }
      - name: Capy deploy key - identity and scope
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CAPY_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CAPY_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-southeast-1
        run: |
          id=$(aws sts get-caller-identity --query Arn --output text); echo "::notice title=capy identity::$id"
          chk() { if eval "$2" >/dev/null 2>&1; then echo "::warning title=capy $1::ALLOWED"; else echo "::notice title=capy $1::denied"; fi; }
          chk "artifacts-bucket-list (expect allowed)" "aws s3 ls s3://capyweb-sam-artifacts-619071347239"
          chk "iam-list-users (expect denied)" "aws iam list-users"
          chk "s3-list-all-buckets (expect denied)" "aws s3 ls"
          chk "lambda-list (expect denied)" "aws lambda list-functions"
          chk "dynamodb-list (expect denied)" "aws dynamodb list-tables"
          chk "ec2-describe (expect denied)" "aws ec2 describe-instances"
          chk "ssm-read-livepeer (expect denied)" "aws ssm get-parameter --name /capyweb/livepeer-api-key"
      - name: AL dns key - identity and scope
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AL_DNS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AL_DNS_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          id=$(aws sts get-caller-identity --query Arn --output text); echo "::notice title=al identity::$id"
          chk() { if eval "$2" >/dev/null 2>&1; then echo "::warning title=al $1::ALLOWED"; else echo "::notice title=al $1::denied"; fi; }
          n=$(aws route53 list-resource-record-sets --hosted-zone-id Z01748582U1VPM60UY0TW --query 'length(ResourceRecordSets)' --output text 2>&1); echo "::notice title=al zone records (expect a number)::$n"
          chk "list-hosted-zones (expect denied)" "aws route53 list-hosted-zones"
          chk "iam-list-users (expect denied)" "aws iam list-users"
          chk "s3-list (expect denied)" "aws s3 ls"
          chk "domains-list (expect denied)" "aws route53domains list-domains --region us-east-1"

  deploy-backend-dev:
    needs: verify-keys
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CAPY_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CAPY_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: aws-actions/setup-sam@v2
        with: {use-installer: true}
      - name: Guard - serverless only
        run: |
          if grep -nE "ProvisionedThroughput:|ProvisionedConcurrencyConfig|AutoPublishAlias" infra/backend/template.yaml; then
            echo "::error::provisioned capacity found in template"; exit 1; fi
          grep -q "BillingMode: PAY_PER_REQUEST" infra/backend/template.yaml
      - name: Build
        run: |
          cd backend/src && npm install --no-audit --no-fund && cd ../..
          sam build --template-file infra/backend/template.yaml --build-dir .aws-sam/build
      - name: Deploy dev
        run: |
          sam deploy --template-file .aws-sam/build/template.yaml \
            --stack-name capyweb-backend-dev \
            --s3-bucket capyweb-sam-artifacts-619071347239 --s3-prefix backend-dev \
            --role-arn arn:aws:iam::619071347239:role/capyweb-cfn-exec \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides Stage=dev LambdaExecRoleArn=arn:aws:iam::619071347239:role/capyweb-lambda-exec \
            --no-confirm-changeset --no-fail-on-empty-changeset
      - name: Smoke test
        run: |
          url=$(aws cloudformation describe-stacks --stack-name capyweb-backend-dev --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "::notice title=dev api url::$url"
          body=$(curl -s -m 15 "$url/health"); echo "::notice title=dev /health::$body"
          echo "$body" | grep -q '"ok":true'
