[package]
name = "capyweb-web"
version = "0.1.0"
edition = "2021"
publish = false
description = "CapyTube front end in Rust/WebAssembly (prototype, docs/WASM_PLAN.md)"

[lib]
name = "capyweb_web"
path = "src/lib.rs"

[[bin]]
name = "capyweb-web"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AbortSignal", "Document", "HtmlDialogElement", "HtmlElement", "Window"] }
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
console_error_panic_hook = "0.1"

# Size first: the wasm is the first-load cost. See docs/WASM_PLAN.md section 1.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
