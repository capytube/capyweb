<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CapyTube, capybara cameras</title>
    <meta name="description" content="Watch the capybaras, then pick their snack. Play coins only, never real money." />
    <meta property="og:title" content="CapyTube" />
    <meta property="og:description" content="Watch the capybaras, then pick their snack." />
    <meta property="og:type" content="website" />
    <!-- No canonical and no og:url here: this shell is served for every route, so either would
         call every page a copy of the home page. The client sets a canonical per route (app.rs). -->
    <meta property="og:image" content="https://capytube.xyz/assets/share/capytube-1200x630.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Two capybaras in photo frames beside the CapyTube logo: watch the capybaras, then pick their snack." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#d0e591" />
    <link data-trunk rel="icon" href="assets/favicon.png" />
    <!-- Self-hosted fonts (style/fonts.css), fetched early: every page uses all three. -->
    <link rel="preload" href="/assets/fonts/commissioner-v24-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/dynapuff-v9-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/hanaleifill-v23-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link data-trunk rel="tailwind-css" href="input.css" />
    <link data-trunk rel="copy-dir" href="assets" />
    <link data-trunk rel="copy-dir" href="fixtures" />
    <link data-trunk rel="copy-file" href="config.json" />
    <link data-trunk rel="copy-file" href="robots.txt" />
    <link data-trunk rel="copy-file" href="sitemap.xml" />
    <!-- Loaded on demand by js/player.js, never at first load. -->
    <link data-trunk rel="copy-dir" href="vendor" />
    <link data-trunk rel="rust" data-bin="capyweb-web" data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
  </head>
  <body>
    <noscript>CapyTube needs JavaScript and WebAssembly to run.</noscript>
  </body>
</html>
